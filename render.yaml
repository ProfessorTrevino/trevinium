# Render Blueprint — activation API

services:
  - type: web
    name: trevinium-activation
    runtime: python
    plan: free
    rootDir: activation-backend
    buildCommand: pip install -r requirements.txt
    startCommand: chmod +x start.sh && ./start.sh
    healthCheckPath: /health
    envVars:
      - key: GUMROAD_PRODUCT_PERMALINK
        value: kavwc
      - key: REVALIDATION_INTERVAL_HOURS
        value: 168
      - key: OFFLINE_GRACE_HOURS
        value: 336
      - key: MAX_ACTIVE_INSTALLS
        value: 2
      - key: DATABASE_PATH
        value: ./activation.db
      - key: ACTIVATION_SIGNING_PRIVATE_KEY_B64
        sync: false
      - key: GUMROAD_ACCESS_TOKEN
        sync: false
        optional: true